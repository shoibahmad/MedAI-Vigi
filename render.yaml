# Render blueprint for PhenoRx.
#
# Docker rather than the native Python runtime: the frontend is a Vite build and
# Render's Python image does not provide Node. The Dockerfile builds the SPA in a
# Node stage and serves it from the Python stage, so one service runs both.

services:
  - type: web
    name: phenorx
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health

    envVars:
      # --- Secrets: set these in the Render dashboard, never in this file ---
      - key: NVIDIA_API_KEY
        sync: false

      # Generated once by Render and kept across deploys.
      - key: SECRET_KEY
        generateValue: true

      # --- Model selection ---
      # The 120B leads. The 550B endpoint is persistently capacity-limited:
      # measured repeatedly, it returned "Service temporarily overloaded" or
      # timed out on every attempt without ever producing a narrative, while
      # burning NVIDIA_TIMEOUT seconds before failing over. The 120B answers in
      # roughly 7-11 seconds. The 550B stays as the fallback for when it has
      # capacity, then deterministic output behind that.
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_MODEL_NAME
        value: nvidia/nemotron-3-super-120b-a12b
      - key: NVIDIA_FALLBACK_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b

      # Short leash on the primary so an overloaded endpoint fails over quickly;
      # a generous budget on the final attempt, which must generate a full
      # narrative. Both are below the gunicorn --timeout of 180.
      # Ceiling across every model and retry. 30s primary + 120s fallback is
      # 150s on its own, against a 180s worker timeout - too close to serve the
      # deterministic fallback properly when both models are slow.
      - key: NVIDIA_TOTAL_BUDGET
        value: "140"
      - key: NVIDIA_TIMEOUT
        value: "30"
      - key: NVIDIA_LONG_TIMEOUT
        value: "120"
      - key: NVIDIA_ENABLE_THINKING
        value: "false"

      # --- Application ---
      - key: FLASK_ENV
        value: production
      - key: PRODUCTION
        value: "true"
      - key: LOG_LEVEL
        value: INFO
