[project]
name = "phenorx"
version = "2.8.0"
description = "Adverse Drug Reaction (ADR) Risk Prediction & Pharmacovigilance Service"
authors = [{ name = "Shoaib Ahmad", email = "shoibahmad@example.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Flask>=3.0.3",
    "Flask-CORS>=4.0.1",
    "Werkzeug>=3.0.3",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.2",
    "xgboost>=2.0.3",
    "google-genai>=0.1.1",
    "pydantic>=2.7.4",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "python-json-logger>=2.0.7",
    "gunicorn>=22.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.8",
    "black>=24.4.2",
    "mypy>=1.10.0",
    "pip-audit>=2.7.3",
]

[tool.poetry]
name = "phenorx"
version = "2.8.0"
description = "Adverse Drug Reaction (ADR) Risk Prediction & Pharmacovigilance Service"
authors = ["Shoaib Ahmad <shoibahmad@example.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
Flask = "^3.0.3"
Flask-CORS = "^4.0.1"
Werkzeug = "^3.0.3"
pandas = "^2.2.2"
numpy = "^1.26.4"
scikit-learn = "^1.5.0"
joblib = "^1.4.2"
xgboost = "^2.0.3"
google-genai = "^0.1.1"
pydantic = "^2.7.4"
python-dotenv = "^1.0.1"
pyyaml = "^6.0.1"
python-json-logger = "^2.0.7"
gunicorn = "^22.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-cov = "^5.0.0"
ruff = "^0.4.8"
black = "^24.4.2"
mypy = "^1.10.0"
pip-audit = "^2.7.3"

[tool.black]
line-length = 100
target-version = ['py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | myenv
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["app", "config", "schemas", "routes", "services", "utils"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "myenv",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "B904",  # raise ... from err
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true

[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "joblib.*",
    "google.genai.*",
    "pandas.*",
    "numpy.*",
    "sentry_sdk.*",
    "flask_cors.*",
    "pythonjsonlogger.*",
    "yaml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --strict-markers --cov=. --cov-report=term-missing"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/myenv/*",
    "*/build/*",
    "*/dist/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
